name: Build Debian RootFS TB311FU

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-rootfs-x86:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static debootstrap e2fsprogs \
            git wget curl unzip xz-utils

      - name: Create Debian trixie rootfs (arm64 via QEMU)
        run: |
          mkdir -p rootfs
          sudo debootstrap --arch=arm64 trixie rootfs http://deb.debian.org/debian
          sudo cp /usr/bin/qemu-aarch64-static rootfs/usr/bin/

      - name: Configure rootfs
        run: |
          echo "deb http://deb.debian.org/debian trixie main contrib non-free" | sudo tee rootfs/etc/apt/sources.list
          sudo chroot rootfs apt-get update
          sudo chroot rootfs apt-get install -y ssh net-tools iproute2 systemd

      - name: Package rootfs image
        run: |
          dd if=/dev/zero of=debian-rootfs.img bs=1M count=2048
          mkfs.ext4 debian-rootfs.img
          mkdir -p mnt
          sudo mount -o loop debian-rootfs.img mnt
          sudo cp -a rootfs/* mnt/
          sudo umount mnt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-rootfs-tb311fu-trixie-x86
          path: debian-rootfs.img

  build-rootfs-arm64:
    runs-on: [self-hosted, ARM64]
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap e2fsprogs git wget curl unzip xz-utils

      - name: Create Debian trixie rootfs (native ARM64)
        run: |
          mkdir -p rootfs
          sudo debootstrap --arch=arm64 trixie rootfs http://deb.debian.org/debian

      - name: Configure rootfs
        run: |
          echo "deb http://deb.debian.org/debian trixie main contrib non-free" | sudo tee rootfs/etc/apt/sources.list
          sudo chroot rootfs apt-get update
          sudo chroot rootfs apt-get install -y ssh net-tools iproute2 systemd

      - name: Package rootfs image
        run: |
          dd if=/dev/zero of=debian-rootfs.img bs=1M count=2048
          mkfs.ext4 debian-rootfs.img
          mkdir -p mnt
          sudo mount -o loop debian-rootfs.img mnt
          sudo cp -a rootfs/* mnt/
          sudo umount mnt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-rootfs-tb311fu-trixie-arm64
          path: debian-rootfs.img
